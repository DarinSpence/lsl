<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logan Lawns - First 20 Lawns Card</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #e7eee8; color: #102d1d; font-family: Arial, Helvetica, sans-serif; }
      .instructions { max-width: 38rem; margin: 2rem auto 1rem; padding: 0 1.25rem; font-size: .95rem; line-height: 1.45; }
      .card {
        width: 3.5in; height: 2in; margin: 0 auto 2rem; padding: .22in .24in;
        background: #123b25; color: #fffdf5; border-radius: .08in;
        display: flex; flex-direction: column; justify-content: space-between;
        box-shadow: 0 .14in .35in rgb(16 45 29 / 20%);
      }
      .brand { margin: 0; color: #bce34b; font-weight: 800; font-size: .14in; letter-spacing: .11em; text-transform: uppercase; }
      h1 { margin: .02in 0; font-size: .33in; line-height: .92; letter-spacing: -.035em; }
      .offer { margin: 0; color: #e3f4c4; font-size: .145in; font-weight: 700; }
      .text { margin: 0; font-size: .175in; font-weight: 800; }
      .phone { display: block; margin-top: .025in; color: #bce34b; font-size: .24in; letter-spacing: .015em; }
      .fine { margin: .025in 0 0; color: #d6e6da; font-size: .09in; }
      @media print {
        @page { size: 3.5in 2in; margin: 0; }
        body { background: #fff; }
        .instructions { display: none; }
        .card { margin: 0; border-radius: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <p class="instructions"><strong>Ready to print:</strong> this card uses LL's approved text number. Open it in a browser and print at 100% scale, or upload/supply the same copy to VistaPrint.</p>
    <main class="card" aria-label="Logan Lawns business card">
      <p class="brand">Logan Lawns</p>
      <div>
        <h1>$40 Lawn Mow</h1>
        <p class="offer">Mowing · Bagging · Weed Eating</p>
      </div>
      <div>
        <p class="text">Text to schedule:</p>
        <span class="phone">913-563-0403</span>
        <p class="fine">Simple. Flat. Done right.</p>
      </div>
    </main>
  </body>
</html>
